[project]
name = "darkvessel-backend"
version = "0.1.0"
description = "Real-Time Dark Vessel Detection Pipeline"
requires-python = ">=3.10,<3.13"
dependencies = [
    "confluent-kafka>=2.3.0",
    "psycopg2-binary>=2.9.9",
    "SQLAlchemy>=2.0.30",
    "GeoAlchemy2>=0.15.1",
    "geopandas>=0.14.4",
    "shapely>=2.0.4",
    "pyproj>=3.6.1",
    "h3>=3.7.7",
    "pandas>=2.2.2",
    "numpy>=1.26.4",
    "pyarrow>=15.0.2",
    "scikit-learn>=1.4.2",
    "joblib>=1.4.2",
    "python-dotenv>=1.0.1",
    "structlog>=24.1.0",
    "tenacity>=8.2.3",
    "pytest>=8.1.1",
    "ruff>=0.4.4",
    "websockets>=16.1.1",
]

[project.optional-dependencies]
batch = [
    "pyspark>=3.5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data_pipeline", "streaming", "detection", "analysis", "monitoring"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

