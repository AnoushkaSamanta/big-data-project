services:
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: ais-kafka
    restart: unless-stopped
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: "4L622n22Q6mtBisDmJq0-g"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s
    mem_limit: 1200m
    volumes:
      - kafkadata:/var/lib/kafka/data

  postgres:
    image: postgis/postgis:16-3.4
    container_name: ais-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ais
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ais_dev_password}
      DB_READ_USER: ${DB_READ_USER:-ais_read}
      DB_READ_PASSWORD: ${DB_READ_PASSWORD:-ais_read_password}
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    command: ["postgres", "-c", "shared_buffers=512MB", "-c", "max_wal_size=2GB"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ais"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 1200m

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ais-frontend
    restart: unless-stopped
    profiles: ["ui"]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ais
      POSTGRES_USER: ${DB_READ_USER:-ais_read}
      POSTGRES_PASSWORD: ${DB_READ_PASSWORD:-ais_read_password}
      NODE_ENV: production
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 600m

  consumer:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ais-consumer
    restart: unless-stopped
    profiles: ["stream"]
    command: ["python3", "-m", "streaming.consumer", "--bootstrap-servers", "kafka:29092", "--pg-host", "postgres"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ais
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ais_dev_password}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    volumes:
      - ./backend:/app/backend
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    mem_limit: 800m

  sweeper:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ais-sweeper
    restart: unless-stopped
    profiles: ["stream"]
    command: ["python3", "-m", "streaming.sweeper", "--interval", "30", "--db-url", "postgresql://postgres:${POSTGRES_PASSWORD:-ais_dev_password}@postgres:5432/ais"]
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-ais_dev_password}@postgres:5432/ais
    volumes:
      - ./backend:/app/backend
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 400m

  scorer:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ais-scorer
    restart: unless-stopped
    profiles: ["stream"]
    command: ["python3", "-m", "detection.ml_scorer", "--loop", "--interval", "45", "--db-url", "postgresql://postgres:${POSTGRES_PASSWORD:-ais_dev_password}@postgres:5432/ais"]
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-ais_dev_password}@postgres:5432/ais
    volumes:
      - ./backend:/app/backend
      - ./models:/app/models:ro
      - ./data:/app/data:ro
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 500m

  spark-master:
    image: bitnami/spark:3.5.1
    container_name: ais-spark-master
    restart: unless-stopped
    profiles: ["batch"]
    ports:
      - "8080:8080"
      - "7077:7077"
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    mem_limit: 1500m

  spark-worker:
    image: bitnami/spark:3.5.1
    container_name: ais-spark-worker
    restart: unless-stopped
    profiles: ["batch"]
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=1G
      - SPARK_WORKER_CORES=2
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    depends_on:
      - spark-master
    mem_limit: 1500m


volumes:
  pgdata:
  kafkadata:
